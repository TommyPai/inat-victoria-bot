name: Tea-tree candidates

# Claude 的每週排程任務把日期範圍寫進 teatree/request.json 推到 main,就會觸發這裡;也可以手動執行。
# 抓 iNaturalist 的茶樹與訪花甲蟲紀錄、拼成照片總表,以單一 commit 強制推到 teatree-work 分支(不累積歷史)。
on:
  push:
    branches: [main]
    paths: [teatree/request.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: teatree-prep
  cancel-in-progress: true

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Build candidates and photo sheets
        run: |
          pip install -q "pillow==11.3.0"
          python teatree_prep.py
      - name: Push to teatree-work (single commit, replaces the branch)
        run: |
          git config user.name "inat-bot"
          git config user.email "inat-bot@users.noreply.github.com"
          export GIT_INDEX_FILE="$RUNNER_TEMP/teatree-index"
          git --work-tree=out add -A
          tree=$(git --work-tree=out write-tree)
          commit=$(git commit-tree "$tree" -m "teatree: candidates $(python -c 'import json;d=json.load(open("out/candidates.json"));print(d["d1"],d["d2"])')")
          git push -f -q origin "$commit:refs/heads/teatree-work"
